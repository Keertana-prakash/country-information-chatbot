<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Information Chatbot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: #2c6fad;
            color: #ffffff;
            padding: 20px 24px;
        }

        .chat-header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .chat-header p {
            font-size: 0.875rem;
            opacity: 0.88;
        }

        .chat-messages {
            flex: 1;
            height: 420px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #f8f9fa;
        }

        .message {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.925rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.bot {
            background-color: #e8f0fe;
            color: #1a1a2e;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background-color: #2c6fad;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 16px 20px;
            border-top: 1px solid #e0e0e0;
            background-color: #ffffff;
        }

        #messageInput {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 24px;
            font-size: 0.925rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #messageInput:focus {
            border-color: #2c6fad;
        }

        #sendButton {
            padding: 10px 22px;
            background-color: #2c6fad;
            color: #ffffff;
            border: none;
            border-radius: 24px;
            font-size: 0.925rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #sendButton:hover {
            background-color: #1e5490;
        }

        #sendButton:disabled {
            background-color: #9ab4d4;
            cursor: not-allowed;
        }

        @media (max-width: 480px) {
            .chat-messages {
                height: 340px;
            }

            .message {
                max-width: 92%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Country Information Chatbot</h1>
            <p>Ask me about a country's capital, national animal, or national flower.</p>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
            <input
                type="text"
                id="messageInput"
                placeholder="Type your message..."
                autocomplete="off"
            />
            <button id="sendButton">Send</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        function appendMessage(text, sender) {
            const msg = document.createElement('div');
            msg.classList.add('message', sender);
            msg.textContent = text;
            chatMessages.appendChild(msg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            messageInput.value = '';
            sendButton.disabled = true;

            try {
                const params = new URLSearchParams();
                params.append('message', text);

                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                });

                const reply = await response.text();
                appendMessage(reply, 'bot');
            } catch (error) {
                appendMessage('Sorry, something went wrong. Please try again.', 'bot');
            } finally {
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        // Initial bot greeting
        appendMessage(
            'Hello! I can help you with country information. Try asking about a country\'s capital, national animal, or national flower.',
            'bot'
        );
        messageInput.focus();
    </script>
</body>
</html>
